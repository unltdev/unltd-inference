name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What gap or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see implemented?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Technical benefit
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Note whether this affects architecture, memory design, model support, or performance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / benchmarks (optional)
      description: Measurements, comparisons against the oracle, or references that support the request.
    validations:
      required: false
