# Workspace de unltd-inference.
#
# Dirección de dependencias (estricta, ver docs/ARCHITECTURE.md §3):
#   tensor ← core ← {model-loader, architectures, memory, tokenizer} ← generation ← cli
# Nadie importa hacia arriba.

[workspace]
resolver = "2"
members = [
    "crates/unltd-tensor",
    "crates/unltd-core",
    "crates/unltd-model-loader",
    "crates/unltd-architectures",
    "crates/unltd-memory",
    "crates/unltd-tokenizer",
    "crates/unltd-generation",
    "crates/unltd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
unltd-tensor = { path = "crates/unltd-tensor" }
unltd-core = { path = "crates/unltd-core" }
unltd-model-loader = { path = "crates/unltd-model-loader" }
unltd-architectures = { path = "crates/unltd-architectures" }
unltd-memory = { path = "crates/unltd-memory" }
unltd-tokenizer = { path = "crates/unltd-tokenizer" }
unltd-generation = { path = "crates/unltd-generation" }

# Dependencias externas, evaluadas en docs/ARCHITECTURE.md §2.
half = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
